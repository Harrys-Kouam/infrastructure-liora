---
- name: Validate the inventory and secrets
  hosts: masters[0]
  connection: local
  gather_facts: false
  tasks:
    - name: Require one master, two workers, one monitoring VM and strong secrets
      ansible.builtin.assert:
        that:
          - groups['masters'] | length == 1
          - groups['workers'] | length == 2
          - groups['monitoring'] | length == 1
          - grafana_admin_password | length >= 24
          - minio_root_password | length >= 24
          - task_manager_jwt_secret | length >= 32
        fail_msg: >-
          The inventory needs one master, two workers and one monitoring VM, and
          GRAFANA_ADMIN_PASSWORD, MINIO_ROOT_PASSWORD (24+ characters) and
          TASK_MANAGER_JWT_SECRET (32+ characters) must be set.
      no_log: true

- name: Kubernetes cluster
  ansible.builtin.import_playbook: kubernetes.yml

- name: Monitoring VM
  ansible.builtin.import_playbook: monitoring.yml

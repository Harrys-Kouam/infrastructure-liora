---
- name: Validate the six-node inventory
  hosts: masters[0]
  connection: local
  gather_facts: false
  tasks:
    - name: Require exactly three masters and three workers
      ansible.builtin.assert:
        that:
          - groups['masters'] | length == 3
          - groups['workers'] | length == 3
        fail_msg: The inventory must contain exactly three masters and three workers.

- name: Install Kubernetes and containerd on every node
  hosts: kubernetes
  become: true
  tasks:
    - name: Set a unique Kubernetes node hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Disable swap
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | default(0) | int > 0
      changed_when: true

    - name: Remove swap entries from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\s*[^#].*\s+swap\s+'
        state: absent

    - name: Install containerd and Kubernetes prerequisites
      ansible.builtin.apt:
        lock_timeout: 300
        name:
          - ca-certificates
          - containerd
          - conntrack
          - iptables
          - socat
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the Kubernetes apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download the Kubernetes package signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: "0644"

    - name: Add the Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Install pinned Kubernetes packages
      ansible.builtin.apt:
        lock_timeout: 300
        name:
          - "kubelet={{ kubernetes_package_version }}"
          - "kubeadm={{ kubernetes_package_version }}"
          - "kubectl={{ kubernetes_package_version }}"
        state: present
        update_cache: true

    - name: Load kernel modules required by Kubernetes
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Enable the Kubernetes kernel modules
      ansible.builtin.command: "modprobe {{ item }}"
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    - name: Enable Kubernetes network forwarding
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        state: present
        sysctl_set: true
        reload: true
      loop:
        - net.ipv4.ip_forward
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables

    - name: Generate the default containerd configuration
      ansible.builtin.command: containerd config default
      register: containerd_default_config
      changed_when: false

    - name: Configure containerd to use systemd cgroups
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_default_config.stdout | replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart containerd

    - name: Enable containerd and kubelet
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - containerd
        - kubelet

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted

- name: Configure the highly available Kubernetes API endpoint
  hosts: masters
  become: true
  tasks:
    - name: Install HAProxy and Keepalived
      ansible.builtin.apt:
        lock_timeout: 300
        name:
          - haproxy
          - keepalived
        state: present
        update_cache: true

    - name: Allow HAProxy to bind the API VIP before it is assigned
      ansible.posix.sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: "1"
        state: present
        sysctl_set: true
        reload: true

    - name: Configure HAProxy
      ansible.builtin.template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
      notify: Restart HAProxy

    - name: Configure Keepalived
      ansible.builtin.template:
        src: keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: "0600"
      notify: Restart Keepalived

    - name: Enable HAProxy and Keepalived
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - haproxy
        - keepalived

  handlers:
    - name: Restart HAProxy
      ansible.builtin.systemd_service:
        name: haproxy
        state: restarted

    - name: Restart Keepalived
      ansible.builtin.systemd_service:
        name: keepalived
        state: restarted

- name: Initialize the first Kubernetes control plane
  hosts: masters[0]
  become: true
  tasks:
    - name: Read the installed Kubernetes version
      ansible.builtin.command: kubeadm version -o short
      register: installed_kubernetes_version
      changed_when: false

    - name: Initialize the control plane with stacked etcd
      ansible.builtin.command:
        cmd: >-
          kubeadm init --kubernetes-version={{ installed_kubernetes_version.stdout }}
          --control-plane-endpoint={{ control_plane_vip }}:6444
          --apiserver-advertise-address={{ ansible_host }}
          --apiserver-cert-extra-sans={{ control_plane_vip }}
          --pod-network-cidr={{ pod_network_cidr }}
          --cri-socket=unix:///run/containerd/containerd.sock --upload-certs
        creates: /etc/kubernetes/admin.conf
      no_log: true

    - name: Re-upload control-plane certificates for joining masters
      ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
      register: control_plane_certificates
      changed_when: false
      no_log: true

    - name: Create a short-lived node join token
      ansible.builtin.command: kubeadm token create --print-join-command --ttl 2h
      register: kubeadm_join_command
      changed_when: false
      no_log: true

    - name: Keep the join credentials in Ansible memory
      ansible.builtin.set_fact:
        kubeadm_certificate_key: "{{ control_plane_certificates.stdout_lines[-1] }}"
        kubeadm_join_token: "{{ kubeadm_join_command.stdout.split()[4] }}"
        kubeadm_ca_hash: "{{ kubeadm_join_command.stdout.split()[-1] }}"
      no_log: true

- name: Join the other control-plane nodes
  hosts: masters
  become: true
  serial: 1
  tasks:
    - name: Join this node to the control plane
      ansible.builtin.command:
        cmd: >-
          kubeadm join {{ control_plane_vip }}:6444
          --token {{ hostvars[groups['masters'][0]].kubeadm_join_token }}
          --discovery-token-ca-cert-hash {{ hostvars[groups['masters'][0]].kubeadm_ca_hash }}
          --control-plane
          --certificate-key={{ hostvars[groups['masters'][0]].kubeadm_certificate_key }}
          --apiserver-advertise-address={{ ansible_host }}
          --cri-socket=unix:///run/containerd/containerd.sock
        creates: /etc/kubernetes/kubelet.conf
      when: inventory_hostname != groups['masters'][0]
      no_log: true

- name: Join the three Kubernetes workers
  hosts: workers
  become: true
  serial: 1
  tasks:
    - name: Join this node as a worker
      ansible.builtin.command:
        cmd: >-
          kubeadm join {{ control_plane_vip }}:6444
          --token {{ hostvars[groups['masters'][0]].kubeadm_join_token }}
          --discovery-token-ca-cert-hash {{ hostvars[groups['masters'][0]].kubeadm_ca_hash }}
          --cri-socket=unix:///run/containerd/containerd.sock
        creates: /etc/kubernetes/kubelet.conf
      no_log: true

- name: Install the pod network and cluster services
  hosts: masters[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    grafana_admin_password: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') }}"
    task_manager_jwt_secret: "{{ lookup('ansible.builtin.env', 'TASK_MANAGER_JWT_SECRET') }}"
    cluster_charts:
      - name: cert-manager
        chart: jetstack/cert-manager
        namespace: cert-manager
        version: "{{ cert_manager_chart_version }}"
        options: ["--set", "crds.enabled=true"]
        timeout: 10m
      - name: monitoring
        chart: prometheus-community/kube-prometheus-stack
        namespace: monitoring
        version: "{{ kube_prometheus_stack_version }}"
        options:
          - --set
          - grafana.service.type=LoadBalancer
          - --set
          - grafana.admin.existingSecret=grafana-admin
          - --set
          - grafana.admin.userKey=admin-user
          - --set
          - grafana.admin.passwordKey=admin-password
        timeout: 15m
      - name: argocd
        chart: argo/argo-cd
        namespace: argocd
        version: "{{ argocd_chart_version }}"
        options: ["--set", "server.service.type=LoadBalancer"]
        timeout: 15m
  tasks:
    - name: Require Grafana and application secrets
      ansible.builtin.assert:
        that:
          - grafana_admin_password | length >= 24
          - task_manager_jwt_secret | length >= 32
        fail_msg: Set strong GRAFANA_ADMIN_PASSWORD and TASK_MANAGER_JWT_SECRET environment variables.
      no_log: true

    - name: Install Flannel pod networking
      ansible.builtin.command:
        cmd: >-
          kubectl apply -f
          https://github.com/flannel-io/flannel/releases/download/{{ flannel_version }}/kube-flannel.yml
      register: flannel_apply
      changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"

    - name: Wait for all six Kubernetes nodes to become Ready
      ansible.builtin.command:
        cmd: kubectl wait --for=condition=Ready node --all --timeout=10m
      changed_when: false

    - name: Install Helm
      ansible.builtin.unarchive:
        src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        extra_opts: [--strip-components=1, linux-amd64/helm]
        creates: /usr/local/bin/helm

    - name: Add Helm repositories
      ansible.builtin.command:
        cmd: "helm repo add {{ item.name }} {{ item.url }} --force-update"
      loop:
        - name: metallb
          url: https://metallb.github.io/metallb
        - name: jetstack
          url: https://charts.jetstack.io
        - name: prometheus-community
          url: https://prometheus-community.github.io/helm-charts
        - name: argo
          url: https://argoproj.github.io/argo-helm
      changed_when: false

    - name: Install the local-path storage provisioner
      ansible.builtin.command:
        cmd: >-
          kubectl apply -f
          https://raw.githubusercontent.com/rancher/local-path-provisioner/{{ local_path_version }}/deploy/local-path-storage.yaml
      register: local_path_apply
      changed_when: "'created' in local_path_apply.stdout or 'configured' in local_path_apply.stdout"

    - name: Wait for local-path storage
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/local-path-provisioner -n local-path-storage --timeout=5m
      changed_when: false

    - name: Install MetalLB
      ansible.builtin.command:
        cmd: >-
          helm upgrade --install metallb metallb/metallb
          --namespace metallb-system --create-namespace
          --version {{ metallb_chart_version }} --wait
      changed_when: true

    - name: Wait for MetalLB custom resources
      ansible.builtin.command:
        cmd: >-
          kubectl wait --for=condition=Established --timeout=180s
          crd/ipaddresspools.metallb.io crd/l2advertisements.metallb.io
      changed_when: false

    - name: Configure MetalLB addresses
      ansible.builtin.command:
        argv: [kubectl, apply, -f, -]
        stdin: "{{ lookup('ansible.builtin.template', 'metallb-pool.yaml.j2') }}"
        stdin_add_newline: true
      register: metallb_config
      changed_when: "'created' in metallb_config.stdout or 'configured' in metallb_config.stdout"

    - name: Create the Grafana admin Secret
      ansible.builtin.command:
        argv: [kubectl, apply, -f, -]
        stdin: "{{ lookup('ansible.builtin.template', 'grafana-secret.yaml.j2') }}"
        stdin_add_newline: true
      register: grafana_secret
      changed_when: "'created' in grafana_secret.stdout or 'configured' in grafana_secret.stdout"
      no_log: true

    - name: Create the application JWT Secret
      ansible.builtin.command:
        argv: [kubectl, apply, -f, -]
        stdin: "{{ lookup('ansible.builtin.template', 'app-secret.yaml.j2') }}"
        stdin_add_newline: true
      register: app_secret
      changed_when: "'created' in app_secret.stdout or 'configured' in app_secret.stdout"
      no_log: true

    - name: Install cert-manager, monitoring and Argo CD
      ansible.builtin.command:
        argv: >-
          {{ ['helm', 'upgrade', '--install', item.name, item.chart,
              '--namespace', item.namespace, '--create-namespace',
              '--version', item.version] + item.options +
              ['--wait', '--timeout', item.timeout] }}
      loop: "{{ cluster_charts }}"
      changed_when: true

    - name: Connect Argo CD to the manifests repository
      ansible.builtin.command:
        argv: [kubectl, apply, -f, -]
        stdin: "{{ lookup('ansible.builtin.template', 'argocd-application.yaml.j2') }}"
        stdin_add_newline: true
      register: argocd_application
      changed_when: "'created' in argocd_application.stdout or 'configured' in argocd_application.stdout"

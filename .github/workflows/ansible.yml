name: Ansible

on:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  pull_request:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency: ansible

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible, ansible-lint and collections
        run: |
          python -m pip install ansible-core ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Check playbook syntax
        run: ansible-playbook -i ansible/inventory.ini ansible/site.yml --syntax-check

      - name: Lint playbook
        run: ansible-lint ansible/site.yml

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: [self-hosted, proxmox]
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Ansible and collections
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install ansible-core
          "$RUNNER_TEMP/venv/bin/ansible-galaxy" collection install -r ansible/requirements.yml

      - name: Write the SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Install Kubernetes and the platform services
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TASK_MANAGER_JWT_SECRET: ${{ secrets.TASK_MANAGER_JWT_SECRET }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          ANSIBLE_SSH_COMMON_ARGS: -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
          ANSIBLE_SSH_RETRIES: "3"
        run: >-
          "$RUNNER_TEMP/venv/bin/ansible-playbook" -i ansible/inventory.ini ansible/site.yml
          -e ansible_ssh_private_key_file=$HOME/.ssh/deploy_key

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
